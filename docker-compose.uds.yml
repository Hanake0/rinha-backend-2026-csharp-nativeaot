services:
  lb:
    volumes:
      - ./ops/nginx/nginx.uds.conf:/etc/nginx/nginx.conf:ro
      - uds-sockets:/sockets

  api1:
    environment:
      Runtime__Http__TransportMode: UnixDomainSocket
      Runtime__Http__UnixSocketPath: /sockets/api1.sock
    volumes:
      - ${RUNTIME_DATA_DIR:-./runtime-data}:/app/data:ro
      - uds-sockets:/sockets

  api2:
    environment:
      Runtime__Http__TransportMode: UnixDomainSocket
      Runtime__Http__UnixSocketPath: /sockets/api2.sock
    volumes:
      - ${RUNTIME_DATA_DIR:-./runtime-data}:/app/data:ro
      - uds-sockets:/sockets

volumes:
  uds-sockets:
