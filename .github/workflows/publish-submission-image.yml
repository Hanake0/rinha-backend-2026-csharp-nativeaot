name: Publish Submission Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that contains the runtime-data asset
        required: true
        default: submission-assets
      runtime_asset_name:
        description: Tarball containing the submission-data directory
        required: true
        default: submission-data.tar.gz
      image_tag:
        description: API image tag to publish
        required: true
        default: submission

jobs:
  publish-submission-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/hanake0/rinha-backend-2026-csharp-nativeaot-api

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Download runtime-data asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.release_tag }}" \
            --pattern "${{ github.event.inputs.runtime_asset_name }}" \
            --dir .

      - name: Extract runtime-data asset
        run: |
          tar -xzf "${{ github.event.inputs.runtime_asset_name }}"
          test -f submission-data/index/manifest.json
          test -f submission-data/mcc_risk.json
          test -f submission-data/normalization.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api.submission
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      - name: Verify anonymous image pull
        run: |
          docker logout ghcr.io
          docker pull "${IMAGE_NAME}:${{ github.event.inputs.image_tag }}"

      - name: Publish image summary
        run: |
          {
            echo "## Submission Image"
            echo ""
            echo "Published image: \`${IMAGE_NAME}:${{ github.event.inputs.image_tag }}\`"
            echo "Runtime asset: \`${{ github.event.inputs.release_tag }}:${{ github.event.inputs.runtime_asset_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
