name: Official Benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of full official benchmark runs
        required: true
        default: "2"

jobs:
  official-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout submission repo
        uses: actions/checkout@v4

      - name: Checkout official repo
        uses: actions/checkout@v4
        with:
          repository: zanfranceschi/rinha-de-backend-2026
          path: official

      - name: Run exact official benchmark
        shell: pwsh
        run: |
          ./scripts/benchmark-official-host.ps1 `
            -OfficialRepoPath ./official `
            -Repetitions ${{ github.event.inputs.repetitions }} `
            -OutputDirectory artifacts/official-actions

      - name: Publish benchmark summary
        shell: pwsh
        run: |
          $summary = Get-Content artifacts/official-actions/summary.json -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY "## Official Benchmark"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Run | p99 (ms) | FP | FN | HTTP errors | Final score |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| --- | ---: | ---: | ---: | ---: | ---: |"
          foreach ($run in $summary.runs) {
            Add-Content $env:GITHUB_STEP_SUMMARY ("| {0} | {1} | {2} | {3} | {4} | {5} |" -f $run.Run, $run.P99Ms, $run.FalsePositive, $run.FalseNegative, $run.HttpErrors, $run.FinalScore)
          }
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY ("Median p99: {0} ms" -f $summary.aggregate.median_p99_ms)
          Add-Content $env:GITHUB_STEP_SUMMARY ("Median final score: {0}" -f $summary.aggregate.median_final_score)

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-benchmark-artifacts
          path: artifacts/official-actions
