services:
  lb:
    image: nginx:1.27-alpine
    platform: linux/amd64
    container_name: rinha2026-lb
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    cpus: 0.15
    mem_limit: 48m
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 48M

  api1:
    image: ghcr.io/hanake0/rinha-backend-2026-csharp-nativeaot-api:submission-d5b886c
    platform: linux/amd64
    container_name: rinha2026-api1
    environment:
      ASPNETCORE_URLS: http://+:9999
      DOTNET_PROCESSOR_COUNT: "1"
      DOTNET_SYSTEM_NET_SOCKETS_INLINE_COMPLETIONS: "1"
      DOTNET_SYSTEM_NET_SOCKETS_THREAD_COUNT: "1"
      Runtime__Detection__ApprovalThreshold: "0.6"
      Runtime__Detection__TopK: "5"
      Runtime__Dataset__IndexDirectory: /app/data/index
      Runtime__Dataset__MccRiskPath: /app/data/mcc_risk.json
      Runtime__Dataset__NormalizationPath: /app/data/normalization.json
      Runtime__Http__ParserMode: Manual
      Runtime__Http__ServerMode: Kestrel
      Runtime__Http__UnsafePreferInlineScheduling: "true"
      Runtime__Search__BeamLevel1: "8"
      Runtime__Search__BeamLevel2: "128"
      Runtime__Search__IndexKind: HierarchicalBeamIvf
      Runtime__Search__RerankCount: "48"
      Runtime__Search__BoundaryRerankCount: "48"
      Runtime__Search__UseLeafRadiusPruning: "true"
      Runtime__Search__UseLastTransactionPartitionPruning: "false"
    cpus: 0.425
    mem_limit: 151m
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: 151M

  api2:
    image: ghcr.io/hanake0/rinha-backend-2026-csharp-nativeaot-api:submission-d5b886c
    platform: linux/amd64
    container_name: rinha2026-api2
    environment:
      ASPNETCORE_URLS: http://+:9999
      DOTNET_PROCESSOR_COUNT: "1"
      DOTNET_SYSTEM_NET_SOCKETS_INLINE_COMPLETIONS: "1"
      DOTNET_SYSTEM_NET_SOCKETS_THREAD_COUNT: "1"
      Runtime__Detection__ApprovalThreshold: "0.6"
      Runtime__Detection__TopK: "5"
      Runtime__Dataset__IndexDirectory: /app/data/index
      Runtime__Dataset__MccRiskPath: /app/data/mcc_risk.json
      Runtime__Dataset__NormalizationPath: /app/data/normalization.json
      Runtime__Http__ParserMode: Manual
      Runtime__Http__ServerMode: Kestrel
      Runtime__Http__UnsafePreferInlineScheduling: "true"
      Runtime__Search__BeamLevel1: "8"
      Runtime__Search__BeamLevel2: "128"
      Runtime__Search__IndexKind: HierarchicalBeamIvf
      Runtime__Search__RerankCount: "48"
      Runtime__Search__BoundaryRerankCount: "48"
      Runtime__Search__UseLeafRadiusPruning: "true"
      Runtime__Search__UseLastTransactionPartitionPruning: "false"
    cpus: 0.425
    mem_limit: 151m
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: 151M
