services:
  lb:
    image: ghcr.io/hanake0/rinha-backend-2026-csharp-nativeaot-lb:submission-v16
    pull_policy: always
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9999:9999"
    environment:
      ASPNETCORE_URLS: http://+:9999
      BACKEND_ENDPOINTS: api1:9999;api2:9999
      LOAD_BALANCER_MODE: IoUring
      LB_ENGINE_COUNT: "1"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "16MB"

  api1:
    image: ghcr.io/hanake0/rinha-backend-2026-csharp-nativeaot-api:submission-v16-fat
    pull_policy: always
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      ASPNETCORE_URLS: http://+:9999
      API_ENGINE_COUNT: "1"
      Runtime__Detection__ApprovalThreshold: "0.6"
      Runtime__Detection__TopK: "5"
      Runtime__Dataset__IndexDirectory: /app/data/index
      Runtime__Dataset__MccRiskPath: /app/data/mcc_risk.json
      Runtime__Dataset__NormalizationPath: /app/data/normalization.json
      Runtime__Http__ParserMode: Manual
      Runtime__Http__ServerMode: IoUring
      Runtime__Search__ExecutionMode: Local
      Runtime__Search__IndexStorageMode: MemoryMapped
      Runtime__Search__BeamLevel1: "8"
      Runtime__Search__BeamLevel2: "128"
      Runtime__Search__BoundaryBeamLevel2: "0"
      Runtime__Search__RerankCount: "48"
      Runtime__Search__BoundaryRerankCount: "48"
      Runtime__Search__UseLeafRadiusPruning: "true"
      Runtime__Search__UseLastTransactionPartitionPruning: "false"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"

  api2:
    image: ghcr.io/hanake0/rinha-backend-2026-csharp-nativeaot-api:submission-v16-fat
    pull_policy: always
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      ASPNETCORE_URLS: http://+:9999
      API_ENGINE_COUNT: "1"
      Runtime__Detection__ApprovalThreshold: "0.6"
      Runtime__Detection__TopK: "5"
      Runtime__Dataset__IndexDirectory: /app/data/index
      Runtime__Dataset__MccRiskPath: /app/data/mcc_risk.json
      Runtime__Dataset__NormalizationPath: /app/data/normalization.json
      Runtime__Http__ParserMode: Manual
      Runtime__Http__ServerMode: IoUring
      Runtime__Search__ExecutionMode: Local
      Runtime__Search__IndexStorageMode: MemoryMapped
      Runtime__Search__BeamLevel1: "8"
      Runtime__Search__BeamLevel2: "128"
      Runtime__Search__BoundaryBeamLevel2: "0"
      Runtime__Search__RerankCount: "48"
      Runtime__Search__BoundaryRerankCount: "48"
      Runtime__Search__UseLeafRadiusPruning: "true"
      Runtime__Search__UseLastTransactionPartitionPruning: "false"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"
