worker_processes 1;

events {
    worker_connections 4096;
}

http {
    upstream fraud_score_backend {
        server api1:9999 max_fails=1 fail_timeout=2s;
        server api2:9999 max_fails=1 fail_timeout=2s;
        keepalive 64;
    }

    server {
        listen 9999;
        access_log off;

        location /ready {
            proxy_connect_timeout 250ms;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Connection "";
            proxy_pass http://fraud_score_backend;
        }

        location /fraud-score {
            proxy_buffering off;
            proxy_connect_timeout 250ms;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://fraud_score_backend;
        }
    }
}
