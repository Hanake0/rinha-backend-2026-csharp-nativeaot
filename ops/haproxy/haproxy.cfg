global
    maxconn 4096
    nbthread 1

defaults
    mode http
    option dontlognull
    timeout connect 250ms
    timeout client 5s
    timeout server 5s
    timeout http-keep-alive 60s

frontend fraud_score_frontend
    bind *:9999
    default_backend fraud_score_backend

backend fraud_score_backend
    balance roundrobin
    http-reuse always
    server api1 api1:9999
    server api2 api2:9999
